# max workers ratio defining how much CPU cores to use
max_workers_ratio: 1.0

add:
  default_size: [1280, 720]
  # Maximum length between two consecutive keyframes (in seconds)
  max_scene_length: 2
  # Keyframe size ratio to the original frame. This also affects resolution of videos
  keyframe_resize_ratio: 1.0
  # Thumbnail size ratio to the keyframe
  thumbnail_resize_ratio: 0.25
  # Max clips length around the keyframes (in seconds)
  clip_length: 7
  # Video compress ratio
  compress_size_rate: 0.5

analyse:
  # num_workers of DataLoader
  num_workers: 4
  # pin_memory of DataLoader
  pin_memory: true

milvus:
  # Extra fields (apart from features)
  fields:
    - field_name: "frame_id"
      datatype: "VARCHAR"
      max_length: 32
      is_primary: true

# List of features
features: &analyse_features
  image_clip_pe-l-14-336:
    model: "image_clip"
    source: "open_clip"
    arch_name: "PE-Core-L-14-336"
    pretrained_model: "meta" 
    analyse:
      batch_size: 64
    index:
      datatype: "FLOAT_VECTOR"
      dim: 1024 
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  image_siglip_so400m-384:
    model: "image_siglip"
    source: "open_clip"
    arch_name: "ViT-SO400M-14-SigLIP-384"
    pretrained_model: "webli"
    analyse:
      batch_size: 64
    index:
      datatype: "FLOAT_VECTOR"
      dim: 1152
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  qwen_vl:
    model: "qwen_vl_embedding"
    pretrained_model: "Qwen/Qwen3-VL-Embedding-2B"
    analyse:
      batch_size: 1
    index:
      datatype: "FLOAT_VECTOR"
      dim: 2048
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  qwen_vl_temporal:
    model: "qwen_vl_embedding_temporal"
    pretrained_model: "Qwen/Qwen3-VL-Embedding-2B"
    analyse:
      batch_size: 1
    index:
      datatype: "FLOAT_VECTOR"
      dim: 2048
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  # video_clip_pe-l-14-336:
  #   model: "video_clip"
  #   source: "open_clip"
  #   arch_name: "PE-Core-L-14-336"
  #   pretrained_model: "meta" 
  #   analyse:
  #     batch_size: 4
  #   index:
  #     datatype: "FLOAT_VECTOR"
  #     dim: 1024 
  #     metric_type: "COSINE"
  #     index_type: "SCANN"
  #     params:
  #       nlist: 512

  ocr:
    model: "ocr"
    source: "tesseract"
    analyse:
      batch_size: 8
    index:
      default_value: ""
      datatype: "VARCHAR"
      max_length: 8192
      index_type: "BM25"
      params:
        bm25_k1: 1.2
        bm25_b: 0.75
        inverted_index_algo: "TAAT_NAIVE"

  asr:
    model: "asr"
    source: "whisperx"
    arch_name: "large-v3-turbo"
    analyse:
      batch_size: 16   # đây là batch_size nội bộ của whisperx.transcribe (chunk theo VAD), KHÔNG phải số clip xử lý song song
    index:
      default_value: ""
      datatype: "VARCHAR"
      max_length: 8192
      index_type: "BM25"
      params:
        bm25_k1: 1.2
        bm25_b: 0.75
        inverted_index_algo: "TAAT_NAIVE"

searcher:
  language_models:
    language_clip_pe-l-14-336:
      model: "image_clip"
      source: "open_clip"
      arch_name: "PE-Core-L-14-336"
      pretrained_model: "meta" 
      target:
        - image_clip_pe-l-14-336 
        # - video_clip_pe-l-14-336 

    language_siglip_so400m-384:
      model: "image_siglip"
      source: "open_clip"
      arch_name: "ViT-SO400M-14-SigLIP-384"
      pretrained_model: "webli"
      target:
        - image_siglip_so400m-384

    language_qwen_vl:
      model: "qwen_vl_embedding"
      pretrained_model: "Qwen/Qwen3-VL-Embedding-2B"
      target:
        - qwen_vl
        - qwen_vl_temporal

    text_bge_m3:
      model: "text_embedding"
      source: "hf"
      pretrained_model: "BAAI/bge-m3"
      backend: "pytorch"
      onnx_provider: "auto"
      target:
        - ocr_dense
        - asr_dense

  ocr:
    ocr_field: "ocr_sparse"
    enable: true
    
  asr:
    asr_field: "asr_sparse"
    enable: true

  # Groq LLM Query Expansion (bắt chước 100% caube gpt-oss-120b / llama3-70b)
  llm:
    enable: true
    provider: "groq"                      # groq, gemini, hoặc openai
    model_name: "openai/gpt-oss-120b"     # Mô hình 120B tham số trên Groq Cloud
    api_key: "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"                           # Để trống để lấy từ GROQ_API_KEY environment variable

  # YOLO Auto-Crop Processor
  yolo:
    enable: true
    model_path: "yolov8x.pt"
    conf_threshold: 0.25
    padding: 15



frontend:
  dev_port: 5173

backends:
  core:
    port: 6900
    search_proxy:
      request_timeout: null
      max_concurrent_requests: 10
      servers:
        - host: http://127.0.0.1:1337
    file_proxy:
      request_timeout: null
      max_concurrent_requests: 10
      servers:
        - host: http://127.0.0.1:4200

  search:
    port: 1337
    collection: "milvus"
    workers: 1
    gpu: true

  file:
    port: 4200
    workers: 1
