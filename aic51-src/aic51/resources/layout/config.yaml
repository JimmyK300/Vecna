# max workers ratio defining how much CPU cores to use
max_workers_ratio: 1.0

add:
  default_size: [1280, 720]
  # Maximum length between two consecutive keyframes (in seconds)
  max_scene_length: 2
  # Keyframe size ratio to the original frame. This also affects resolution of videos
  keyframe_resize_ratio: 1.0
  # Thumbnail size ratio to the keyframe
  thumbnail_resize_ratio: 0.25
  # Max clips length around the keyframes (in seconds)
  clip_length: 7
  # Video compress ratio
  compress_size_rate: 0.5

analyse:
  # num_workers of DataLoader
  num_workers: 4
  # pin_memory of DataLoader
  pin_memory: true

milvus:
  # Extra fields (apart from features)
  fields:
    - field_name: "frame_id"
      datatype: "VARCHAR"
      max_length: 32
      is_primary: true

# List of features
features: &analyse_features
  # image_clip_pe-l-14-336: (TẮT THEO YÊU CẦU)
  #   model: "image_clip"
  #   source: "open_clip"
  #   arch_name: "PE-Core-L-14-336"
  #   pretrained_model: "meta"
  #   analyse:
  #     batch_size: 64
  #   index:
  #     datatype: "FLOAT_VECTOR"
  #     dim: 1024
  #     metric_type: "COSINE"
  #     index_type: "SCANN"
  #     params:
  #       nlist: 512

  # image_siglip_so400m-384: (TẮT SIGLIP 1 THEO YÊU CẦU)
  #   model: "image_siglip"
  #   source: "open_clip"
  #   arch_name: "ViT-SO400M-14-SigLIP-384"
  #   pretrained_model: "webli"
  #   analyse:
  #     batch_size: 64
  #   index:
  #     datatype: "FLOAT_VECTOR"
  #     dim: 1152
  #     metric_type: "COSINE"
  #     index_type: "SCANN"
  #     params:
  #       nlist: 512

  image_siglip2_so400m-378:
    model: "image_siglip"
    source: "open_clip"
    arch_name: "ViT-SO400M-14-SigLIP2-378"
    pretrained_model: "webli"
    analyse:
      batch_size: 32
    index:
      datatype: "FLOAT_VECTOR"
      dim: 1152
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  qwen_vl:
    model: "qwen_vl_embedding"
    pretrained_model: "Qwen/Qwen3-VL-Embedding-2B"
    analyse:
      batch_size: 1
    index:
      datatype: "FLOAT_VECTOR"
      dim: 2048
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  # video_clip_pe-l-14-336:
  #   model: "video_clip"
  #   source: "open_clip"
  #   arch_name: "PE-Core-L-14-336"
  #   pretrained_model: "meta"
  #   analyse:
  #     batch_size: 4
  #   index:
  #     datatype: "FLOAT_VECTOR"
  #     dim: 1024
  #     metric_type: "COSINE"
  #     index_type: "SCANN"
  #     params:
  #       nlist: 512

  ocr:
    model: "ocr"
    source: "paddle_vietocr"
    pretrained_model: "vgg_transformer"
    analyse:
      batch_size: 16
      pad_y: 6
      pad_x: 4
      det_lang: "vi"
    index:
      default_value: ""
      datatype: "VARCHAR"
      max_length: 8192
      index_type: "BM25"
      params:
        bm25_k1: 1.2
        bm25_b: 0.75
        inverted_index_algo: "TAAT_NAIVE"

  asr:
    model: "asr"
    source: "whisperx"
    arch_name: "large-v3-turbo"
    analyse:
      batch_size: 16
    index:
      default_value: ""
      datatype: "VARCHAR"
      max_length: 8192
      index_type: "BM25"
      params:
        bm25_k1: 1.2
        bm25_b: 0.75
        inverted_index_algo: "TAAT_NAIVE"

  ocr_dense:
    model: "text_embedding"
    source: "hf"
    pretrained_model: "BAAI/bge-m3"
    text_source: "ocr"
    # pytorch keeps the original Transformers path. onnx uses ONNX Runtime.
    backend: "pytorch"
    # auto prefers DirectML when the ORT build has it and GPU is allowed.
    onnx_provider: "auto"
    # auto/preload: tokenize the pending corpus, length-bucket, then infer.
    # serial: old per-video tokenize-inside-the-loop path.
    onnx_pipeline: "auto"
    # auto: grow short-text batches up to onnx_max_batch so attention work
    # stays near batch_size * onnx_max_length^2. off: fixed batch_size.
    onnx_batch_adapt: "auto"
    onnx_max_batch: 128
    analyse:
      batch_size: 16
    index:
      datatype: "FLOAT_VECTOR"
      dim: 1024
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

  asr_dense:
    model: "text_embedding"
    source: "hf"
    pretrained_model: "BAAI/bge-m3"
    text_source: "asr"
    backend: "pytorch"
    onnx_provider: "auto"
    onnx_pipeline: "auto"
    onnx_batch_adapt: "auto"
    onnx_max_batch: 128
    analyse:
      batch_size: 16
    index:
      datatype: "FLOAT_VECTOR"
      dim: 1024
      metric_type: "COSINE"
      index_type: "SCANN"
      params:
        nlist: 512

searcher:
  language_models:
    # language_clip_pe-l-14-336: (TẮT THEO YÊU CẦU)
    #   model: "image_clip"
    #   source: "open_clip"
    #   arch_name: "PE-Core-L-14-336"
    #   pretrained_model: "meta"
    #   target:
    #     - image_clip_pe-l-14-336

    # language_siglip_so400m-384: (TẮT SIGLIP 1 THEO YÊU CẦU)
    #   model: "image_siglip"
    #   source: "open_clip"
    #   arch_name: "ViT-SO400M-14-SigLIP-384"
    #   pretrained_model: "webli"
    #   target:
    #     - image_siglip_so400m-384

    language_siglip2_so400m-378:
      model: "image_siglip"
      source: "open_clip"
      arch_name: "ViT-SO400M-14-SigLIP2-378"
      pretrained_model: "webli"
      target:
        - image_siglip2_so400m-378

    language_qwen_vl:
      model: "qwen_vl_embedding"
      pretrained_model: "Qwen/Qwen3-VL-Embedding-2B"
      target:
        - qwen_vl

    text_bge_m3:
      model: "text_embedding"
      source: "hf"
      pretrained_model: "BAAI/bge-m3"
      backend: "pytorch"
      onnx_provider: "auto"
      target:
        - ocr_dense
        - asr_dense

  ocr:
    ocr_field: "ocr_sparse"
    ocr_dense_field: "ocr_dense"
    enable: true
    hybrid_alpha: 0.0

  asr:
    asr_field: "asr_sparse"
    asr_dense_field: "asr_dense"
    enable: true
    hybrid_alpha: 0.0

  reranker:
    enable: true
    model: "BAAI/bge-reranker-v2-m3"
    top_k: 20

  # Groq LLM Query Expansion (bắt chước 100% caube gpt-oss-120b / llama3-70b)
  llm:
    enable: true
    provider: "groq"                      # groq, gemini, hoặc openai
    model_name: "openai/gpt-oss-120b"     # Mô hình 120B tham số trên Groq Cloud
    api_key: ""                           # Để trống để tự lấy từ GROQ_API_KEY

  # YOLO Auto-Crop Processor
  yolo:
    enable: true
    model_path: "yolov8x.pt"
    conf_threshold: 0.25
    padding: 15



frontend:
  dev_port: 5173

backends:
  core:
    port: 6900
    search_proxy:
      request_timeout: null
      max_concurrent_requests: 10
      servers:
        - host: http://127.0.0.1:1337
    file_proxy:
      request_timeout: null
      max_concurrent_requests: 10
      servers:
        - host: http://127.0.0.1:4200

  search:
    port: 1337
    collection: "milvus"
    workers: 1
    gpu: true

  file:
    port: 4200
    workers: 1
