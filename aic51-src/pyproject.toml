[build-system]
requires = ["setuptools>=73.0.1", "setuptools-scm"]
build-backend = "setuptools.build_meta"
[project]
name = "aic51"
version = "3.0.0"
requires-python = ">= 3.10"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dependencies = [
  "rich",
  "torch",
  "torchvision",
  "torchaudio",
  "numpy",
  "transformers",
  "python-dotenv",
  "pyyaml",
  "opencv-python",
  "pillow",
  "pymilvus>=2.6.0",
  "fastapi",
  "uvicorn",
  "sentencepiece",
  "jupyter",
  "open_clip_torch",
  "pytesseract",
  "apscheduler",
  "deep-translator",
  "faster-whisper",
  "ctranslate2>=4.5.0",
  "pyannote.audio",
  "nltk",
  "pandas",
  "whisperx"
]
[project.scripts]
aic51-cli = "aic51.cli:__main__.main"
[tool.setuptools]
packages = [
  "aic51",
]